[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uce-concept-explorer"
version = "0.2.0"
description = "CPU-only exploratory analysis of binarized Universal Concept Encoder activations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "huggingface_hub>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.9"]
notebooks = ["datasets>=2.18", "matplotlib>=3.7", "wordcloud>=1.9", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
