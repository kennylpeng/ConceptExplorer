[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uce-concept-explorer"
version = "0.3.0"
description = "CPU analysis of sparse Universal Concept Encoder activations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
evaluation = ["matplotlib>=3.7", "statsmodels>=0.14"]
gemini = ["google-genai>=3", "torch>=2.6", "scipy>=1.11", "safetensors>=0.4", "huggingface_hub>=0.24", "tqdm"]
annotation = ["openai[aiohttp]>=3", "httpx2", "tqdm>=4.0", "tiktoken"]
dev = ["pytest>=8", "nbformat>=5.9"]
notebooks = ["datasets>=2.18", "matplotlib>=3.7", "wordcloud>=1.9", "torch", "huggingface_hub>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]
